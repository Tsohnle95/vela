<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vela — screenshot tour</title>
    <meta name="description" content="Screenshots of Vela: repository, editor, terminal, and agent panels on one desktop.">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="../resources/icon.png">
    <link rel="stylesheet" href="showcase.css">
    <script src="showcase.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <a class="wordmark" href="https://github.com/Tsohnle95/vela">
          <img src="../resources/icon.png" alt="" width="22" height="22">
          <span>Vela</span>
        </a>
        <a class="source" href="https://github.com/Tsohnle95/vela">Repository ↗</a>
      </header>

      <div class="intro">
        <h1>One workspace for the whole coding loop</h1>
        <p>Repository, editor, terminal, and agent panels together on one desktop.</p>
      </div>

      <section class="carousel" data-carousel aria-roledescription="carousel" aria-label="Vela screenshots">
        <div class="stage" data-stage tabindex="0" aria-label="Screenshot viewer. Use the left and right arrow keys to change screenshots.">
          <div class="track" data-track>
            <figure class="slide" role="group" aria-roledescription="slide" aria-label="Screenshot 1 of 3" data-slide-caption="Docked workspace — repository, editor, and agent side by side.">
              <img src="../resources/vela.png" alt="Vela with the repository explorer, code editor, and an agent panel open side by side." width="1275" height="798" fetchpriority="high" decoding="async" draggable="false">
            </figure>
            <figure class="slide" role="group" aria-roledescription="slide" aria-label="Screenshot 2 of 3" data-slide-caption="Agent mode — one focused conversation, the repository still in view.">
              <img src="../resources/agent-mode.png" alt="Vela in agent mode with a single wide agent panel showing a streamed code explanation." width="1510" height="949" decoding="async" draggable="false">
            </figure>
            <figure class="slide" role="group" aria-roledescription="slide" aria-label="Screenshot 3 of 3" data-slide-caption="Dual agent mode — two agents working in parallel on the same workspace.">
              <img src="../resources/dual-agent.png" alt="Vela with two agent panels side by side, each showing a different streamed response." width="1509" height="948" decoding="async" draggable="false">
            </figure>
          </div>

          <button class="arrow prev" type="button" data-prev aria-label="Previous screenshot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button class="arrow next" type="button" data-next aria-label="Next screenshot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
          </button>

          <div class="dots" data-dots role="group" aria-label="Choose screenshot"></div>
        </div>

        <div class="meta">
          <p class="caption" data-caption></p>
          <p class="count"><kbd>←</kbd><kbd>→</kbd> <span data-count>1 / 3</span></p>
        </div>
        <p class="sr-only" aria-live="polite" data-live></p>
      </section>
    </main>
  </body>
</html>
