name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    env:
      # Keep rust-cache and the ephemeral runner working while local builds
      # use the sibling build-junk directory configured in .cargo/config.toml.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Formatting stays opt-in until the imported tree's rustfmt debt is
      # cleared as its own mechanical change; see docs/development.md.
      - name: Verify
        run: bash scripts/verify.sh --release
