<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data:; connect-src 'self' ws:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mira</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; }
      #launch-screen { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; background: #edf5ee; color: #254e46; font: 12px Arial, sans-serif; -webkit-app-region: drag; }
      #launch-artwork { display: block; width: 100%; height: 100%; object-fit: contain; }
    </style>
  </head>
  <body>
    <div id="launch-screen" role="status" aria-label="Starting Mira">
      <img id="launch-artwork" src="./src/assets/folded-light.svg" width="380" height="320" alt="Mira — integrated development environment" fetchpriority="high" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
