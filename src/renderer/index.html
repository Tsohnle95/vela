<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data:; connect-src 'self' ws:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vela</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; }
      #launch-screen { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; background: #edf5ee; color: #254e46; font: 12px Arial, sans-serif; -webkit-app-region: drag; }
      #launch-frame { position: relative; width: min(380px, 100vw); aspect-ratio: 380 / 320; max-height: 100vh; }
      #launch-artwork { display: block; width: 100%; height: 100%; object-fit: contain; }
      #launch-fold-motion { animation: launch-float 4s ease-in-out infinite; transform-box: view-box; transform-origin: 190px 136.5px; }
      @keyframes launch-float { 50% { transform: translateY(-5px) rotate(2deg); } }
      @media (prefers-reduced-motion: reduce) { #launch-fold-motion { animation: none; } }
    </style>
  </head>
  <body>
    <div id="launch-screen" role="status" aria-label="Starting Vela">
      <div id="launch-frame">
        <svg id="launch-artwork" viewBox="0 0 380 320" role="img" aria-label="Vela — integrated development environment">
          <defs>
            <linearGradient id="launch-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7fff7" /><stop offset=".5" stop-color="#71cbb4" /><stop offset="1" stop-color="#248b7d" /></linearGradient>
            <linearGradient id="launch-shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e7e77" /><stop offset="1" stop-color="#b4ead7" /></linearGradient>
            <filter id="launch-shadow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14" /></filter>
            <clipPath id="launch-folds"><path d="M114 178L156 79L192 145L228 79L266 178L229 194L192 145L153 194Z" /></clipPath>
            <linearGradient id="launch-dawn-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="180" y2="70">
              <stop offset="0" stop-color="#15483d" stop-opacity=".4" />
              <stop offset=".43" stop-color="#15483d" stop-opacity=".08" />
              <stop offset=".5" stop-color="#fff" stop-opacity=".55" />
              <stop offset=".64" stop-color="#fff" stop-opacity=".04" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
          </defs>
          <ellipse cx="190" cy="209" rx="64" ry="8" fill="#478978" opacity=".18" filter="url(#launch-shadow)" />
          <g id="launch-fold-motion">
            <path d="M114 178L156 79L192 145L228 79L266 178L229 194L192 145L153 194Z" fill="url(#launch-mint)" />
            <path d="M156 79L165 161L192 145Z" fill="url(#launch-shade)" />
            <path d="M228 79L220 161L192 145Z" fill="#1c736c" />
            <path d="M114 178L156 79L192 145L228 79" fill="none" stroke="#fff" stroke-width="1.3" opacity=".9" />
            <g clip-path="url(#launch-folds)">
              <rect id="launch-dawn" x="-180" y="50" width="500" height="170" fill="url(#launch-dawn-gradient)" opacity="0" />
            </g>
          </g>
          <text x="190" y="267" font-family="Arial,Helvetica,sans-serif" font-size="39" fill="#254e46" font-weight="500" letter-spacing="-2.3" text-anchor="middle">Vela</text>
          <text x="190" y="291" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="#6b9387" letter-spacing="1.8" text-anchor="middle">integrated development environment</text>
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
