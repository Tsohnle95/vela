<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Fifteen angled light casts for the Vela product page, each with a delayed beam and a continuous photon stream.">
  <title>Vela — Lumen lab</title>
  <link rel="icon" href="../assets/icon.png">
  <link rel="stylesheet" href="vela-base.css?v=nebula5">
  <link rel="stylesheet" href="vela-product.css?v=nebula5">
  <link rel="stylesheet" href="vela-effect.css?v=nebula5">
  <link rel="stylesheet" href="lab-controls.css?v=nebula5">
  <link rel="stylesheet" href="lumen.css?v=nebula5">
</head>
<body class="d1 effect-page lumen-page">
  <div id="site"></div>
  <a class="skip" href="#main">Skip to content</a>

  <aside class="lab-bar lumen-bar" id="lumen-bar" aria-label="Lumen lab controls">
    <a class="lab-home" href="lumen-index.html?v=nebula5">Lumen</a>
    <button id="lumen-previous" type="button" aria-label="Previous light cast">←</button>
    <label class="lab-sr" for="lumen-select">Light cast</label>
    <select id="lumen-select"></select>
    <button id="lumen-next" type="button" aria-label="Next light cast">→</button>
    <span class="lab-sep" aria-hidden="true"></span>
    <span class="lab-status">0.5s cast</span>
    <span class="lumen-meta" id="lumen-meta">01 / 15</span>
    <a class="lab-pure" href="lumen-index.html?v=nebula5">All casts ↗</a>
  </aside>
  <button class="lab-restore" id="lumen-restore" type="button" hidden aria-label="Show Lumen lab controls">Lumen</button>

  <script src="fragments.js?v=nebula5"></script>
  <script src="vela-page.js?v=nebula5"></script>
  <script src="lumen-engine.js?v=nebula5"></script>
  <script src="lumen.js?v=nebula5"></script>
</body>
</html>
