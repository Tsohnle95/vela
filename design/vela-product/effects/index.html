<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Ten full-screen WebGL background studies for Vela.">
  <title>Vela — Background effects</title>
  <link rel="icon" href="../assets/icon.png">
  <link rel="stylesheet" href="effects.css">
</head>
<body data-layout="bottom-left">
  <canvas id="effect-canvas" aria-hidden="true"></canvas>
  <div class="effect-vignette" aria-hidden="true"></div>
  <div class="effect-grain" aria-hidden="true"></div>

  <header class="effect-header">
    <a class="effect-brand" href="../cloudroom/index.html?design=1">
      <img src="../assets/icon.png" width="1024" height="1024" alt="">
      <span>Vela</span>
    </a>
    <div class="effect-controls">
      <button id="previous" type="button" aria-label="Previous effect">←</button>
      <label class="effect-sr" for="effect-select">Background effect</label>
      <select id="effect-select"></select>
      <button id="next" type="button" aria-label="Next effect">→</button>
    </div>
    <a class="effect-download" href="https://github.com/Tsohnle95/vela/releases" target="_blank" rel="noopener">Download Vela ↗</a>
  </header>

  <main class="effect-overlay">
    <p class="effect-index" id="effect-index">01 / 10</p>
    <h1 class="effect-title" id="effect-title">Aurora</h1>
    <p class="effect-line" id="effect-line">A slow sky of light.</p>
    <p class="effect-product">Vela — a desktop IDE for coding with an agent.</p>
  </main>

  <footer class="effect-footer">
    <span>Full-screen WebGL study</span>
    <span id="effect-footer-name">Aurora</span>
  </footer>

  <script src="effects.js"></script>
</body>
</html>
