<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Mira Blue lens loading artwork"><defs><radialGradient id="lens"><stop stop-color="#86c6ff" stop-opacity=".65"/><stop offset="1" stop-color="#86c6ff" stop-opacity="0"/></radialGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1" ><stop offset="0" stop-color="#172b60"/><stop offset="0.5" stop-color="#4176ce"/><stop offset="1" stop-color="#8cd3ff"/></linearGradient><filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="14"/></filter></defs><style>.float{animation:float 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.bloom{animation:bloom 4s ease-in-out infinite}.draw{stroke-dasharray:650;animation:draw 3s ease-out both}@keyframes float{50%{transform:translateY(-5px) rotate(2deg)}}@keyframes bloom{50%{opacity:.55}}@keyframes draw{from{stroke-dashoffset:650}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.float,.bloom,.draw{animation:none}}</style><rect width="400" height="300" fill="#101b3d"/><ellipse cx="299" cy="149" rx="118" ry="121" fill="url(#blue)"/><ellipse cx="289" cy="141" rx="74" ry="103" fill="#122347" stroke="#a2d6ff" stroke-width="1.2" transform="rotate(22 289 141)"/><ellipse cx="277" cy="126" rx="59" ry="89" fill="url(#lens)" opacity=".45" transform="rotate(22 277 126)"/><ellipse class="bloom" cx="300" cy="90" rx="16" ry="58" fill="#b8e9ff" opacity=".2" filter="url(#blur)" transform="rotate(25 300 90)"/><text x="29" y="39" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="#99b1da" letter-spacing="1.8" >MIRA DESKTOP</text><text x="26" y="178" font-family="Arial,Helvetica,sans-serif" font-size="62" fill="#edf7ff" font-weight="500" letter-spacing="-2.3" >Mira</text><text x="30" y="214" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="#93add5" letter-spacing="1.8" >A CLEARER SPACE</text></svg>