<svg xmlns="http://www.w3.org/2000/svg" width="380" height="320" viewBox="0 0 380 320" role="img" aria-label="Mira Quiet luxury loading artwork"><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1" ><stop offset="0" stop-color="#76624a"/><stop offset="0.25" stop-color="#d1bda0"/><stop offset="0.5" stop-color="#7a684e"/><stop offset="0.8" stop-color="#a89070"/><stop offset="1" stop-color="#eadcc3"/></linearGradient></defs><style>.float{animation:float 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.bloom{animation:bloom 4s ease-in-out infinite}.draw{stroke-dasharray:650;animation:draw 3s ease-out both}@keyframes float{50%{transform:translateY(-5px) rotate(2deg)}}@keyframes bloom{50%{opacity:.55}}@keyframes draw{from{stroke-dashoffset:650}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.float,.bloom,.draw{animation:none}}</style><rect width="380" height="320" fill="#eae7df"/><text x="190" y="36" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="#827668" letter-spacing="1.8" text-anchor="middle">THE MIRA ENVIRONMENT</text><g class="draw" fill="none" stroke="url(#gold)" stroke-width="1.2"><rect x="143" y="77" width="94" height="94" rx="45" transform="rotate(-26 190 124)"/><rect x="147" y="81" width="86" height="86" rx="41" transform="rotate(-26 190 124)"/><rect x="151" y="85" width="78" height="78" rx="37" transform="rotate(-26 190 124)"/><rect x="155" y="89" width="70" height="70" rx="33" transform="rotate(-26 190 124)"/><rect x="159" y="93" width="62" height="62" rx="29" transform="rotate(-26 190 124)"/><rect x="163" y="97" width="54" height="54" rx="25" transform="rotate(-26 190 124)"/><rect x="167" y="101" width="46" height="46" rx="21" transform="rotate(-26 190 124)"/></g><text x="190" y="249"  font-size="61" fill="#3b3834" font-family="Georgia,serif" font-style="italic" text-anchor="middle" letter-spacing="-3">Mira</text><text x="190" y="278" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="#8b7c6