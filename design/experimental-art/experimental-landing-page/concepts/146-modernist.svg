<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Mira Modernist loading artwork"><defs><linearGradient id="cobalt" x1="0" y1="0" x2="1" y2="1" ><stop offset="0" stop-color="#1343e8"/><stop offset="1" stop-color="#6b8eff"/></linearGradient></defs><style>.float{animation:float 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.bloom{animation:bloom 4s ease-in-out infinite}.draw{stroke-dasharray:650;animation:draw 3s ease-out both}@keyframes float{50%{transform:translateY(-5px) rotate(2deg)}}@keyframes bloom{50%{opacity:.55}}@keyframes draw{from{stroke-dashoffset:650}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.float,.bloom,.draw{animation:none}}</style><rect width="400" height="300" fill="#f3f3ef"/><text x="28" y="35" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="#4a4d54" letter-spacing="1.8" >MIRA / DESKTOP</text><path d="M28 52H372" fill="none" stroke="#d3d5d4" stroke-width=".7"/><g class="float"><path d="M313 79L347 113L313 147L279 113Z" fill="url(#cobalt)" stroke="none" /><path d="M313 92V134M292 113H334" fill="none" stroke="#fff" stroke-width="1" opacity=".7"/></g><text x="23" y="216" font-family="Arial,Helvetica,sans-serif" font-size="103" fill="#13171e"   font-weight="600" letter-spacing="-7">Mira</text><text x="30" y="252" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="#585e68" letter-spacing="1.8" >IDEAS INTO MOTION</text><text x="372" y="252" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#585e68" text-anchor="end">01 — ∞</text></svg>