<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" role="img" aria-label="Vela Obsidian dawn loading artwork"><defs><radialGradient id="halo"><stop stop-color="#a692cf" stop-opacity=".65"/><stop offset="1" stop-color="#a692cf" stop-opacity="0"/></radialGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1" ><stop offset="0" stop-color="#ddd6ed"/><stop offset="0.35" stop-color="#72617c"/><stop offset="0.65" stop-color="#141016"/><stop offset="1" stop-color="#d6bddc"/></linearGradient><linearGradient id="stone" x1="0" y1="0" x2="1" y2="1" ><stop offset="0" stop-color="#27252d"/><stop offset="0.55" stop-color="#0e0e11"/><stop offset="1" stop-color="#020204"/></linearGradient></defs><style>.float{animation:float 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.bloom{animation:bloom 4s ease-in-out infinite}.draw{stroke-dasharray:650;animation:draw 3s ease-out both}@keyframes float{50%{transform:translateY(-5px) rotate(2deg)}}@keyframes bloom{50%{opacity:.55}}@keyframes draw{from{stroke-dashoffset:650}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.float,.bloom,.draw{animation:none}}</style><rect width="360" height="340" fill="#070708"/><g class="bloom"><circle cx="180" cy="142" r="113" fill="url(#halo)" /></g><circle cx="180" cy="142" r="70" fill="url(#rim)" /><circle cx="181" cy="144" r="68.5" fill="url(#stone)" /><path d="M120 120A65 65 0 0 1 224 94" fill="none" stroke="#eee1ff" stroke-width=".6" opacity=".7"/><text x="180" y="270" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#e4dfe8" font-weight="500" letter-spacing="-2.3" text-anchor="middle">Vela</text><text x="180" y="294" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="#6e6876" letter-spacing="1.8" text-anchor="middle">BEGIN AGAIN</text></svg>