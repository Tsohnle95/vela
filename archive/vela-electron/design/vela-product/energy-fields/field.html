<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Ten channeling-energy studies applied to the real Vela interface.">
  <title>Vela — Field lab</title>
  <link rel="icon" href="../assets/icon.png">
  <link rel="stylesheet" href="vela-base.css">

  <link rel="stylesheet" href="field.css">

<body class="d1 energy-page">
  <div id="site"></div>
  <canvas id="energy-canvas" aria-hidden="true"></canvas>
  <div class="energy-vignette" aria-hidden="true"></div>

  <aside class="energy-bar" aria-label="Field lab controls">

    <button id="energy-prev" type="button" aria-label="Previous study">←</button>

    <button id="energy-next" type="button" aria-label="Next study">→</button>
    <span class="energy-index" id="energy-index">01 / 10</span>
    <a class="energy-all" href="index.html">All ten</a>

  <div class="energy-caption">
    <p id="energy-name">Cascade</p>
    <p id="energy-line">A full-page waterfall of light descends through the real Vela page.</p>
  </div>

  <script src="fragments.js"></script>
  <script src="vela-page.js"></script>
  <script src="field.js"></script>
