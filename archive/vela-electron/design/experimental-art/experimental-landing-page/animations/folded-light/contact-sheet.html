<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folded Light / Motion sheet</title><style>*{box-sizing:border-box}body{background:#151d1b;color:#d9eade;margin:24px;font:13px/1.5 system-ui}a{color:#afd1b9}header{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:24px}h1{font-size:24px;margin:0}button,select{background:#263a2d;border:1px solid #54775e;color:#e7f5e9;padding:8px;border-radius:5px}label{display:flex;align-items:center;gap:8px}.sheet{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{border:1px solid #455b4a;border-radius:8px;overflow:hidden;background:#1f2d23;color:inherit;text-decoration:none}.card svg{width:100%;display:block;background:#edf5ee}.notes{padding:10px 12px;min-height:82px}.notes strong{display:block;font-size:14px}.notes p{color:#a2bdaa;font-size:11px;line-height:1.4;margin:5px 0}#phase{width:160px}body[data-static] .notes{min-height:58px}@media(max-width:1000px){.sheet{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){.sheet{grid-template-columns:repeat(2,minmax(0,1fr))}body{margin:12px}}</style>
<header><h1>Folded Light / Motion sheet</h1><a href="./">Full gallery ↗</a><label>Studies<select id="group"><option value="all">All 50</option><option value="01">01–10 / Fold</option><option value="11">11–20 / Formation</option><option value="21">21–30 / Light</option><option value="31">31–40 / Material</option><option value="41">41–50 / Precision and experiments</option></select></label><label>Frame<input id="phase" type="range" min="0" max="100" value="35"><output id="time">1.05 / 3.00 s</output></label><button id="play">Play</button><a href="verify.html">Verification ↗</a></header><main class="sheet"></main>
<script type="module">
import {concepts,createStage,DURATION} from './motions.js';
const params=new URLSearchParams(location.search),group=document.querySelector('#group'),phase=document.querySelector('#phase'),sheet=document.querySelector('.sheet');group.value=params.get('group')||'all';phase.value=params.get('phase')||35;
let cards=[],playing=false,last=0,elapsed=Number(phase.value)*DURATION/100;
function render(){cards.forEach(c=>c.stage.destroy());sheet.replaceChildren();cards=[];const start=Number(group.value);for(const info of concepts.filter(c=>group.value==='all'||Number(c.id)>=start&&Number(c.id)<start+10)){const card=document.createElement('a');card.className='card';card.href='./?concept='+info.id;const art=document.createElement('div');card.append(art);const notes=document.createElement('div');notes.className='notes';const title=document.createElement('strong');title.textContent=info.id+' / '+info.name;const rule=document.createElement('p');rule.textContent=info.rule;notes.append(title,rule);card.append(notes);sheet.append(card);const stage=createStage(art,info.id);cards.push({stage});stage.draw(Number(phase.value)/100);}updateTime();}
function updateTime(){document.querySelector('#time').textContent=(Number(phase.value)*DURATION/100000).toFixed(2)+' / 3.00 s';}
group.addEventListener('change',()=>{const u=new URL(location);u.searchParams.set('group',group.value);history.replaceState(null,'',u);render();});phase.addEventListener('input',()=>{playing=false;document.querySelector('#play').textContent='Play';elapsed=Number(phase.value)*DURATION/100;cards.forEach(c=>c.stage.draw(Number(phase.value)/100));updateTime();});document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';};function tick(t){const dt=last?Math.max(0,t-last):0;last=t;if(playing&&!document.hidden){elapsed=(elapsed+dt)%DURATION;phase.value=elapsed/DURATION*100;cards.forEach(c=>c.stage.draw(elapsed/DURATION));updateTime();}requestAnimationFrame(tick);}render();requestAnimationFrame(tick);
window.foldedSheet={get count(){return cards.length;}};
</script></html>
