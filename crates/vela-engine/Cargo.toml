[package]
name = "vela-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vela-core = { workspace = true }
vela-opencode = { workspace = true }
vela-terminal = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
sha2 = "0.10"
url = "2"
reqwest = { workspace = true }
libc = "0.2"
notify = "=8.2.0"

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tokio-stream = "0.1"
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSObject", "NSURL", "NSError", "NSFileManager", "NSObjCRuntime"] }
